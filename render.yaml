# One-click deploy on Render: New + -> Blueprint -> pick this repo. It only asks for ADAPTION_API_KEY.
# WhatsApp settings (WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, ...) are added later under Environment.
services:
  - type: web
    name: straywatch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ADAPTION_API_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: straywatch-verify
      - key: SW_DEMO_MODE
        value: "1"
