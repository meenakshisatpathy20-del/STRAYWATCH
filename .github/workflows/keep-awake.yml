name: keep-awake
# Render's free plan sleeps after 15 idle minutes, so the first visitor (or SOS) waits ~1 minute.
# Ping the live site every 10 minutes so it stays awake. GitHub may delay scheduled runs a little.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://straywatch-0h6w.onrender.com/health
