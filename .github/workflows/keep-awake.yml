name: keep-awake
# Health check of the live site (Azure App Service, Always On). Fails loudly if the site goes down.
# Runs every 30 minutes.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://straywatch-cacyarcncugkf3cr.indiasouthcentral-01.azurewebsites.net/health
